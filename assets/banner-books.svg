<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="Stacks of Nigerian school textbooks from Nursery to SS3">
  <style>
    .b { animation: restack 21s cubic-bezier(.3,.7,.3,1) infinite both;
         transform-box: fill-box; transform-origin: 50% 100%; }
    @keyframes restack {
      0%   { transform: translate(var(--sx), var(--sy)) rotate(var(--sr)); opacity: 0; }
      4.5% { transform: translate(0, 5px) rotate(0deg); opacity: 1; }
      6%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      21%  { transform: translate(0, 0) rotate(0deg); opacity: 1; }
      25%  { transform: translate(var(--ex), var(--ey)) rotate(var(--er)); opacity: 0; }
      100% { transform: translate(var(--ex), var(--ey)) rotate(var(--er)); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .b { animation: none; }
      .sB, .sC { display: none; }
    }
  </style>
